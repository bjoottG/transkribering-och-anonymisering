[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI använder anropade default-argument (Form, Depends)
  "UP006", "UP007", "UP035", "UP045",  # koden hålls körbar även på äldre Python
]

[tool.pytest.ini_options]
testpaths = ["tests"]
